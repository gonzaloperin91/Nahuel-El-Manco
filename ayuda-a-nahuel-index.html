function build(){
 SKY=mk(W,H,()=>{const gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,'#fbd98a');gr.addColorStop(.55,'#f6a85c');gr.addColorStop(1,'#ec6f4f');g.fillStyle=gr;g.fillRect(0,0,W,H);g.strokeStyle='rgba(120,50,20,.12)';g.lineWidth=1;for(let i=0;i<90;i++){const x=rnd(0,W),y=rnd(0,GY);g.beginPath();g.moveTo(x,y);g.lineTo(x+rnd(6,22),y+rnd(-2,2));g.stroke()}});
 SUN=mk(900,900,()=>{g.translate(450,450);for(let i=0;i<24;i++){g.rotate(Math.PI/12);g.fillStyle='rgba(255,246,200,.16)';g.beginPath();g.moveTo(0,0);g.lineTo(450,-30);g.lineTo(450,30);g.closePath();g.fill()}});
 for(let i=0;i<3;i++)CLD.push(mk(130,60,()=>{for(const[a,b,r]of[[30,36,18],[55,26,24],[85,34,20],[105,40,14],[65,40,22]]){ellp(a,b,r,r*.9);g.fillStyle='#fff6dc';g.fill()}g.fillStyle='rgba(236,111,79,.3)';g.fillRect(14,44,110,10);for(const[a,b,r]of[[30,36,18],[55,26,24],[85,34,20],[105,40,14]]){g.beginPath();g.arc(a,b,r,Math.PI*1.1,Math.PI*1.9);g.strokeStyle=INK;g.lineWidth=2.2;g.stroke()}}));
 FAR=mk(720,200,()=>{let x=0;const cols=['#a45d5a','#8f4f57','#b8685a'];while(x<720){const w=rnd(46,86),h=rnd(70,170);g.fillStyle=pick(cols);g.fillRect(x,200-h,w,h);g.strokeStyle='rgba(42,22,8,.6)';g.lineWidth=2;g.strokeRect(x,200-h,w,h);for(let wy=200-h+10;wy<188;wy+=16)for(let wx=x+8;wx<x+w-10;wx+=14){g.fillStyle=Math.random()<.5?'#f7c978':'#7a3f4c';g.fillRect(wx,wy,7,9)}x+=w+rnd(2,8)}
  g.fillStyle='#5a3040';g.fillRect(300,16,70,34);g.strokeRect(300,16,70,34);g.fillRect(332,50,6,50);const sy=['#5cb85c','#e0463c','#3b82d6','#f2c230'],ss=['A','B','X','Y'];g.font='bold 18px sans-serif';g.textAlign='center';ss.forEach((s,i)=>{g.fillStyle=sy[i];g.fillText(s,312+i*15,40)})});
 MID=mk(720,230,()=>{[[20,'#f2e0b0','#c4553a'],[190,'#9fd4c0','#a8452f'],[360,'#f0b968','#7a3f2e'],[540,'#e8a0a0','#b8573b']].forEach(h=>house(h[0],130,130,100,h[1],h[2]));

function glove(x,y,r,rot){g.save();g.translate(x,y);g.rotate(rot);g.scale(r/10,r/10);for(const a of[-.7,-.2,.3]){g.save();g.rotate(a);ellp(9,0,6,3.4);ol('#fff',2);g.restore()}ellp(0,0,9,8.5);ol('#fff',2.4);g.save();g.rotate(-1.3);ellp(6,0,6,3.4);ol('#fff',2);g.restore();g.fillStyle='#d8452e';g.fillRect(-12,-6,5,12);g.strokeStyle=INK;g.lineWidth=2;g.strokeRect(-12,-6,5,12);g.restore()}

 leg(Math.PI,'#2c4d8f');leg(0,'#3a63b0');arm(1,nh>=2);
 ellp(0,-58,18,21);ol('#d8452e',3);g.beginPath();g.moveTo(-9,-50);g.quadraticCurveTo(0,-42,10,-50);g.stroke();g.fillStyle='#ffe3a0';g.fillRect(-2,-56,3,9);ellp(2,-76,10,5);ol('#b8341f',2.5);
